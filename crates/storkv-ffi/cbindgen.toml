language = "C"
cpp_compat = true
include_guard = "STORKV_H"
pragma_once = true
documentation = true
documentation_style = "doxy"
header = "/* Generated by cbindgen from crates/storkv-ffi. Do not edit manually. */"
after_includes = """
typedef struct StorkvPoolHandle StorkvPoolHandle;
typedef struct StorkvScopeHandle StorkvScopeHandle;
typedef struct StorkvTxHandle StorkvTxHandle;
typedef struct StorkvWatchHandle StorkvWatchHandle;
"""
tab_width = 4
line_length = 100

[export]
prefix = ""

[fn]
args = "horizontal"
