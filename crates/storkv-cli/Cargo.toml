[package]
name = "storkv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "storkv_cli"
path = "src/lib.rs"

[[bin]]
name = "storkvctl"
path = "src/bin/storkvctl.rs"

[[test]]
name = "cli"
path = "../../tests/cli.rs"

[dependencies]
storkv-core.workspace = true
storkv-proto.workspace = true
storkv-client.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
base64.workspace = true
clap.workspace = true
bytes.workspace = true
crc32c.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
storkv-server.workspace = true
