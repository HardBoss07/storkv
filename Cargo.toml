[workspace]
resolver = "2"
members = [
    "crates/storkv-core",
    "crates/storkv-proto",
    "crates/storkv-server",
    "crates/storkv-client",
    "crates/storkv-tui",
    "crates/storkv-cli",
    "crates/storkv-sdk",
    "crates/storkv-ffi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/HardBoss07/storkv"
rust-version = "1.87"

[workspace.dependencies]
storkv-core = { path = "crates/storkv-core" }
storkv-proto = { path = "crates/storkv-proto" }
storkv-client = { path = "crates/storkv-client" }
storkv-server = { path = "crates/storkv-server" }
storkv-cli = { path = "crates/storkv-cli" }
storkv-tui = { path = "crates/storkv-tui" }
storkv-sdk = { path = "crates/storkv-sdk" }
storkv-ffi = { path = "crates/storkv-ffi" }

axum = { version = "0.8", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "query",
    "tokio",
    "ws",
] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32c = "0.6"
crossbeam-channel = "0.5"
crossbeam-skiplist = "0.1"
crossterm = "0.29"
fs2 = "0.4"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
lz4_flex = "0.14"
parking_lot = "0.12"
proptest = "1"
prost = "0.14"
protoc-bin-vendored = "3"
rcgen = "0.13"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
] }
tonic = { version = "0.14", features = ["transport", "codegen"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
zstd = "0.14"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
mod_module_files = "warn"
