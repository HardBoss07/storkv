syntax = "proto3";

package storkv.v1;

message Empty {}

message PingReply {
  bool ok = 1;
}

message ScopeRef {
  uint32 scope_id = 1;
  string name = 2;
}

message GetRequest {
  uint32 scope_id = 1;
  bytes key = 2;
}

message GetReply {
  bool found = 1;
  bytes value = 2;
}

message PutRequest {
  uint32 scope_id = 1;
  bytes key = 2;
  bytes value = 3;
  uint64 ttl_ms = 4;
}

message DeleteRequest {
  uint32 scope_id = 1;
  bytes key = 2;
}

message DeleteRangeRequest {
  uint32 scope_id = 1;
  bytes start_key = 2;
  bytes end_key = 3;
}

message MergeRequest {
  uint32 scope_id = 1;
  bytes key = 2;
  int64 counter_delta = 3;
  bytes custom = 4;
  MergeOp op = 5;
}

message MergeOp {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    COUNTER_ADD = 1;
    CUSTOM = 2;
    APPEND_BYTES = 3;
    MAX_I64 = 4;
    MIN_I64 = 5;
    BIT_OR = 6;
    BIT_AND = 7;
  }
  Kind kind = 1;
  int64 i64_value = 2;
  uint64 u64_value = 3;
  bytes data = 4;
  optional uint64 max_len = 5;
}

message Pair {
  bytes key = 1;
  bytes value = 2;
}

message ScanRequest {
  uint32 scope_id = 1;
  bytes start_key = 2;
  bytes end_key = 3;
  bytes prefix = 4;
}

message ScanReply {
  repeated Pair pairs = 1;
}

message BeginTxReply {
  uint64 read_seq = 1;
}

message Mutation {
  uint32 scope_id = 1;
  bytes key = 2;
  bytes value = 3;
  uint64 expires_at_ms = 4;
  uint32 kind = 5;
  bytes end_key = 6;
}

message ReadEntry {
  uint32 scope_id = 1;
  bytes key = 2;
}

message CommitRequest {
  uint64 read_seq = 1;
  repeated ReadEntry read_set = 2;
  repeated Mutation write_set = 3;
}

message CommitReply {
  bool committed = 1;
}

message CreateScopeRequest {
  string name = 1;
  ScopeOptions options = 2;
}

message ScopeOptions {
  uint32 durability = 1;
  uint64 sync_interval_ms = 2;
  uint32 retention = 3;
  uint64 default_ttl_ms = 4;
  uint32 compaction_style = 5;
  uint32 prefix_bloom_len = 6;
  bool has_prefix_bloom = 7;
  uint64 min_ttl_ms = 8;
  bool has_min_ttl = 9;
  uint64 max_ttl_ms = 10;
  bool has_max_ttl = 11;
  optional bool allow_permanent = 12;
}

message WatchRequest {
  uint32 scope_id = 1;
  bool all_scopes = 2;
  // Resume after this sequence number. Zero starts from live events only.
  uint64 from_seq = 3;
}

message ChangeEvent {
  uint32 kind = 1;
  uint32 scope_id = 2;
  bytes key = 3;
  bytes value = 4;
  uint64 seq = 5;
  // Absolute Unix epoch milliseconds, zero when the key is permanent.
  uint64 expires_at_ms = 6;
}

message TelemetryReply {
  uint64 writes_total = 1;
  uint64 reads_total = 2;
  uint64 write_conflicts_total = 3;
  uint64 compactions_total = 4;
  uint64 fsyncs_total = 5;
  uint64 backups_completed_total = 6;
  uint64 backups_failed_total = 7;
  uint64 last_backup_timestamp_ms = 8;
  uint64 last_backup_seq = 9;
  uint64 wal_segments_shipped_total = 10;
}

message CheckpointRequest {
  string dest_dir = 1;
}

message BackupRequest {
  bool wait = 1;
}

message BackupReply {
  string generation_id = 1;
  uint64 seq = 2;
}

message BackupStatusReply {
  bool enabled = 1;
  uint64 last_backup_timestamp_ms = 2;
  uint64 last_backup_seq = 3;
  uint64 backups_completed_total = 4;
  uint64 backups_failed_total = 5;
  uint64 wal_segments_shipped_total = 6;
  string last_error = 7;
  string backup_root = 8;
  uint64 next_full_backup_in_ms = 9;
  string sink = 10;
}

message VerifyBackupRequest {
  bool has_target_seq = 1;
  uint64 target_seq = 2;
}

message VerifyBackupReply {
  uint32 generations_checked = 1;
  uint64 files_checked = 2;
  uint64 bytes_checked = 3;
  repeated string errors = 4;
}

message BackupEntry {
  string generation_id = 1;
  uint32 kind = 2;
  uint64 created_at_ms = 3;
  uint64 min_seq = 4;
  uint64 max_seq = 5;
  uint64 total_bytes = 6;
  uint32 files = 7;
  string compression = 8;
}

message ListBackupsReply {
  repeated BackupEntry entries = 1;
}

service Storkv {
  rpc Ping(Empty) returns (PingReply);
  rpc Health(Empty) returns (PingReply);
  rpc Get(GetRequest) returns (GetReply);
  rpc Put(PutRequest) returns (Empty);
  rpc Delete(DeleteRequest) returns (Empty);
  rpc DeleteRange(DeleteRangeRequest) returns (Empty);
  rpc Merge(MergeRequest) returns (Empty);
  rpc Scan(ScanRequest) returns (ScanReply);
  rpc BeginTx(Empty) returns (BeginTxReply);
  rpc Commit(CommitRequest) returns (CommitReply);
  rpc CreateScope(CreateScopeRequest) returns (ScopeRef);
  rpc DropScope(ScopeRef) returns (Empty);
  rpc Watch(WatchRequest) returns (stream ChangeEvent);
  rpc Telemetry(Empty) returns (TelemetryReply);
}

service StorkvAdmin {
  rpc AdminStats(Empty) returns (TelemetryReply);
  rpc Checkpoint(CheckpointRequest) returns (Empty);
  rpc Compact(Empty) returns (Empty);
  rpc CreateSnapshot(ScopeRef) returns (Empty);
  rpc UnpinSnapshot(ScopeRef) returns (Empty);
  rpc TriggerBackup(BackupRequest) returns (BackupReply);
  rpc BackupStatus(Empty) returns (BackupStatusReply);
  rpc VerifyBackup(VerifyBackupRequest) returns (VerifyBackupReply);
  rpc ListBackups(Empty) returns (ListBackupsReply);
}
